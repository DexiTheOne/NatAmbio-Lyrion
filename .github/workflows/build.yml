name: Build Lyrion plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux x86-64 engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build build --parallel
      - name: Test audio and browser JavaScript
        run: |
          ctest --test-dir build --output-on-failure
          node --check plugin/HTML/EN/plugins/NatAmbioAlpha/radar.js
      - name: Package
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/package.py build/natambio-alpha \
            "https://github.com/$REPOSITORY/releases/download/$TAG"
          unzip -t dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: natambio-alpha-linux-x86-64
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: natambio-alpha-linux-x86-64
          path: dist/
      - name: Publish immutable plugin ZIP and repository XML
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test -f "dist/NatAmbioAlpha-${TAG#v}.zip"
          gh release create "$TAG" dist/* --verify-tag --title "NatAmbio Alpha $TAG" \
            --notes-file RELEASE.md
